name: Publish to PyPI

# Run by hand from the Actions tab. Builds the sdist and wheel at `ref`, checks them, and uploads
# to PyPI with trusted publishing (OIDC): the `pypi` environment is the only thing that can publish,
# and no token is stored anywhere. Publishing an already-uploaded version fails; nothing here
# deletes or overwrites a release.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build and publish (for example v0.11.0)
        type: string
        default: main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build twine
          python -m build

      - name: Check the metadata
        run: python -m twine check dist/*

      - name: The built wheel version matches the source
        run: |
          python - <<'PY'
          import glob, re, tomllib, zipfile
          from pathlib import Path
          init = re.search(r'^__version__ = "([^"]+)"', Path("src/adsbtui/__init__.py").read_text("utf-8"), re.MULTILINE).group(1)
          project = tomllib.loads(Path("pyproject.toml").read_text("utf-8"))["project"]["version"]
          assert init == project, f"__version__ {init} != pyproject {project}"
          (wheel,) = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as z:
              name = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              meta = z.read(name).decode()
          built = next(l.split(": ", 1)[1] for l in meta.splitlines() if l.startswith("Version: "))
          assert built == init, f"wheel version {built} != source version {init}"
          print("wheel version", built)
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
