name: Release

# Manual, from main only. Reads the version from the source (ZeroVer: 0.MINOR.PATCH, or
# 0.MINOR.PATCHrcN for a pre-release), checks it, builds, and publishes a GitHub Release
# tagged v<version>. It fails rather than replace: an existing tag or release stops it, and
# nothing here deletes or overwrites a published release.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    # Fails fast, before anything is built: bad version, existing tag, existing release.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check the version
        id: version
        run: |
          python .github/scripts/release_check.py --tags "$(git tag --list 'v*')" | tee -a "$GITHUB_OUTPUT"

      - name: Refuse an existing release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to replace it" >&2
            exit 1
          fi

  build-windows:
    # A PyInstaller one-file exe (unsigned). If this fails, release never runs and nothing is published.
    needs: check
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build the exe
        shell: pwsh
        run: |
          python -m pip install ".[windows]" pyinstaller
          pyinstaller --onefile --console --name adsb-tui --collect-submodules adsbtui --collect-data adsbtui .github/scripts/exe_entry.py

      - name: The exe runs
        shell: pwsh
        run: |
          $feed = Join-Path $env:RUNNER_TEMP "feed.json"
          Set-Content -Path $feed -Value '{"now": 1, "aircraft": []}'
          .\dist\adsb-tui.exe --check --url $feed --lat 37.7749 --lon -122.4194
          if ($LASTEXITCODE -ne 0) { throw "--check exited $LASTEXITCODE" }
          $got = (.\dist\adsb-tui.exe --version) -join ""
          if ($got -ne "adsbtui $env:VERSION") { throw "version mismatch: '$got'" }

      - name: Name the exe and write its checksum
        shell: pwsh
        run: |
          $name = "adsb-tui-$env:VERSION-windows-x64.exe"
          New-Item -ItemType Directory -Path out | Out-Null
          Copy-Item dist\adsb-tui.exe "out\$name"
          $hash = (Get-FileHash "out\$name" -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD\out\$name.sha256", "$hash  $name`n")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe
          path: out/*
          if-no-files-found: error

  release:
    needs: [check, build-windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-exe
          path: windows

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: The built wheel runs from a clean environment
        # Installs only the wheel into a fresh venv, away from the checkout, and runs the
        # health check on an empty feed: catches a package that tests only because of the source tree.
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          echo '{"now": 1, "aircraft": []}' > feed.json
          "$RUNNER_TEMP/smoke/bin/adsbtui" --check --url "$RUNNER_TEMP/feed.json" --lat 37.7749 --lon -122.4194
          test "$("$RUNNER_TEMP/smoke/bin/adsbtui" --version)" = "adsbtui ${{ needs.check.outputs.version }}"

      - name: The built version matches the tag
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          python - <<'PY'
          import glob, os, zipfile
          (wheel,) = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as z:
              name = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              meta = z.read(name).decode()
          built = next(l.split(": ", 1)[1] for l in meta.splitlines() if l.startswith("Version: "))
          assert built == os.environ["VERSION"], (built, os.environ["VERSION"])
          print("wheel version", built)
          PY

      - name: Publish
        # No --clobber, and the tag was checked above: gh creates the tag at this commit
        # and fails if anything raced us.
        env:
          TAG: ${{ needs.check.outputs.tag }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          gh release create "$TAG" dist/* windows/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes $flags
