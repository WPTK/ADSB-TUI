[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adsb-tui"
version = "0.9.0"
description = "A curses TUI for tracking nearby aircraft from a dump1090/readsb ADS-B feed"
readme = "README.md"
license = "CC0-1.0"
requires-python = ">=3.11"
authors = [{ name = "WPTK" }]
dependencies = []

[project.optional-dependencies]
windows = ["windows-curses>=2.3"]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6.100", "pyte>=0.8.2", "coverage>=7.10", "pytest-xdist>=3"]

[project.scripts]
adsbtui = "adsbtui.__main__:main"

[tool.hatch.build.targets.sdist]
exclude = ["docs/screenshots", "AUDIT.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/adsbtui"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The UAT layer launches the real program in a pty; it has its own CI job (pytest -m uat).
addopts = "-m 'not uat'"
markers = ["uat: out-of-process terminal tests (pty + pyte); POSIX only"]

[tool.coverage.run]
branch = true
source_pkgs = ["adsbtui"]
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 85
show_missing = true
