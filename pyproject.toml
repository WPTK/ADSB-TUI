[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adsb-tui"
version = "0.11.0"
description = "A curses TUI for tracking nearby aircraft from a dump1090/readsb ADS-B feed"
readme = "README.md"
license = "CC0-1.0"
requires-python = ">=3.11"
authors = [{ name = "WPTK" }]
dependencies = []

[project.optional-dependencies]
windows = ["windows-curses>=2.3"]

[project.scripts]
adsbtui = "adsbtui.__main__:main"

[tool.hatch.build.targets.sdist]
exclude = ["docs/screenshots"]

[tool.hatch.build.targets.wheel]
packages = ["src/adsbtui"]
